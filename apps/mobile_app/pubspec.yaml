name: mobile_app
description: "Multi-Role Flutter Mobile Application (Customer, Vendor, Rider) for Batkhela Marketplace."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  marketplace_core:
    path: ../../packages/marketplace_core
  google_fonts: ^6.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
